<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa - PSHT Ranting Genuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lotusPink: '#FBCFE8',
                        lotusSoft: '#FDF8FA',
                        lotusPurple: '#7E22CE',
                        lotusDark: '#2E1065', 
                    }
                }
            }
        }
    </script>
    <style>
        @media (max-width: 767px) {
            .mobile-card-table thead { display: none; }
            .mobile-card-table, .mobile-card-table tbody { display: block; }
            .mobile-card-table tr { display: block; padding: .75rem 0; }
            .mobile-card-table td { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .65rem 1rem; text-align: right; }
            .mobile-card-table td::before { content: attr(data-label); color: #64748b; font-size: .65rem; font-weight: 700; text-align: left; text-transform: uppercase; }
            .mobile-card-table td:first-child { display: block; text-align: left; }
            .mobile-card-table td:first-child::before { display: none; }
            .mobile-card-table .detail-row td { display: block; text-align: left; }
            .mobile-card-table .detail-row td::before { display: none; }
        }
    </style>
</head>
<body class="bg-[#FDF8FA] text-slate-800 font-sans min-h-screen flex flex-col selection:bg-pink-300 selection:text-purple-900">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-pink-200 shadow-sm">
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 md:px-12 h-20 flex justify-between items-center">
            
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-100 to-pink-100 flex items-center justify-center text-purple-700 font-bold text-lg border border-pink-200 group-hover:scale-105 transition-transform">
                    🌸
                </div>
                <div>
                    <h1 class="font-bold text-purple-950 text-base tracking-wider uppercase leading-none mb-1">PSHT Genuk</h1>
                    <p class="text-[9px] text-pink-600 uppercase tracking-widest font-bold">Pendataan Ranting</p>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-widest text-slate-500">
                <a href="index.html" class="hover:text-pink-500 transition-colors">Beranda</a>
                <a href="data-siswa.html" class="text-purple-900 border-b-2 border-purple-900 pb-1">Data Siswa</a>
                <a href="absensi.html" class="hover:text-pink-500 transition-colors">Absensi & Kalender</a>
            </nav>
            <button type="button" onclick="toggleMobileMenu()" aria-label="Buka menu" aria-expanded="false" class="md:hidden w-10 h-10 rounded-xl bg-purple-50 text-purple-900 border border-pink-200 text-xl">☰</button>
        </div>
        <nav id="mobile-menu" class="hidden md:hidden absolute top-20 left-0 right-0 bg-white border-b border-pink-200 px-4 py-3 shadow-xl">
            <div class="flex flex-col gap-1 text-xs font-bold uppercase tracking-widest text-slate-600">
                <a href="index.html" class="rounded-lg px-4 py-3 hover:bg-purple-50">Beranda</a>
                <a href="data-siswa.html" class="rounded-lg px-4 py-3 bg-purple-50 text-purple-900">Data Siswa</a>
                <a href="absensi.html" class="rounded-lg px-4 py-3 hover:bg-purple-50">Absensi & Kalender</a>
            </div>
        </nav>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 md:px-12 py-8 md:py-12">
        
        <!-- Header Halaman & Pencarian -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <span class="text-pink-500 font-mono text-xs uppercase tracking-widest block mb-2 font-bold">Data Siswa</span>
                <h2 class="text-3xl font-black uppercase tracking-tight text-purple-950">Data Siswa dan Hasil Ujian</h2>
            </div>
            
            <div class="w-full md:w-auto relative">
                <input id="cari-siswa" type="search" placeholder="Cari nama siswa..." class="w-full md:w-72 bg-white border border-pink-200 text-sm rounded-xl px-4 py-3 pl-10 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all shadow-sm">
                <span class="absolute left-3 top-3.5 text-slate-400">🔍</span>
            </div>
        </div>

        <!-- TABEL UTAMA SISWA (Dibuat Dinamis dari Database) -->
        <div class="bg-white rounded-3xl border border-pink-200 shadow-sm overflow-hidden mb-8">
            <div class="overflow-x-auto">
                <table class="mobile-card-table w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-purple-50/50 border-b border-pink-100 text-xs font-bold text-slate-400 uppercase">
                            <th class="p-4 md:p-5">Siswa</th>
                            <th class="p-4 md:p-5">Alamat / Domisili</th>
                            <th class="p-4 md:p-5">TTL</th>
                            <th class="p-4 md:p-5 text-center">Tingkatan Sabuk</th>
                            <th class="p-4 md:p-5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-siswa-body" class="divide-y divide-pink-100 text-sm">
                        <!-- Data akan dimuat secara otomatis oleh JavaScript dari Database Supabase -->
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-400">Sedang menyiapkan data siswa...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-pink-200 py-8 mt-auto text-center text-xs text-slate-500 font-mono bg-[#FDF8FA]">
        <p>PSHT RANTING GENUK © 2026 • Data latihan dan perkembangan siswa</p>
    </footer>

    <!-- SCRIPT RENDER DINAMIS DARI DATABASE -->
    <script>
        async function toggleRow(rowId, iconId) {
            const row = document.getElementById(rowId);
            const icon = document.getElementById(iconId);

            if (row.classList.contains('hidden')) {
                row.classList.remove('hidden');
                icon.classList.add('rotate-180');
                const panel = row.querySelector('.rekap-panel');
                if (panel && !panel.dataset.loaded) {
                    panel.innerHTML = '<p class="text-xs text-slate-400">Sedang membuka rekap siswa...</p>';
                    const siswaId = encodeURIComponent(row.dataset.siswaId);
                    const [ujianResponse, penilaianResponse] = await Promise.all([
                        fetch('/api/ujian?siswa_id=' + siswaId),
                        fetch('/api/penilaian?siswa_id=' + siswaId)
                    ]);
                    if (!ujianResponse.ok || !penilaianResponse.ok) {
                        panel.innerHTML = '<p class="text-xs text-rose-600">Gagal memuat rekap siswa.</p>';
                        return;
                    }
                    const ujian = await ujianResponse.json();
                    const penilaian = await penilaianResponse.json();
                    panel.dataset.loaded = 'true';
                    panel.innerHTML = `
                        <div class="mb-5"><h6 class="font-bold text-purple-950 text-xs uppercase mb-2">Rekap Ujian</h6>${ujian.length ? ujian.map((item) => `<div class="flex flex-col sm:flex-row justify-between gap-2 border-b border-pink-100 py-2 text-xs"><span>${escapeHTML(item.periode)}</span><span class="font-bold">${escapeHTML(item.nilai)} - ${escapeHTML(item.status)}</span></div>`).join('') : '<p class="text-xs text-slate-500">Belum ada data ujian.</p>'}</div>
                         <div><h6 class="font-bold text-purple-950 text-xs uppercase mb-2">Penilaian Latihan</h6>${penilaian.length ? penilaian.map((item) => `<div class="flex flex-col sm:flex-row justify-between gap-2 border-b border-pink-100 py-2 text-xs"><span>${escapeHTML(item.periode_bulan)} - ${escapeHTML(item.materi)}</span><span class="font-bold">${escapeHTML(item.nilai_angka)} - ${escapeHTML(item.predikat)}</span></div>`).join('') : '<p class="text-xs text-slate-500">Belum ada data penilaian.</p>'}</div>`;
                }
            } else {
                row.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Ambil data siswa dari backend Go saat halaman dibuka
        document.addEventListener("DOMContentLoaded", async function() {
            const tbody = document.getElementById('tabel-siswa-body');
            
            try {
                const response = await fetch('/api/siswa');
                const dataSiswa = await response.json();
                
                if (dataSiswa && dataSiswa.length > 0) {
                    tbody.innerHTML = ""; // Bersihkan teks memuat
                    
                    dataSiswa.forEach((siswa, index) => {
                        const rowId = `detail-${index + 1}`;
                        const iconId = `icon-${index + 1}`;
                        
                        // Buat inisial nama untuk avatar lingkaran jika foto kosong
                        const inisial = siswa.nama.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();

                        let badgeColor = "bg-slate-800 text-white";
                        if (siswa.sabuk.toLowerCase().includes('jambon')) badgeColor = "bg-pink-500 text-white";
                        if (siswa.sabuk.toLowerCase().includes('hijau')) badgeColor = "bg-green-600 text-white";

                        // Template baris utama tabel
                        let tr = document.createElement('tr');
                        tr.className = "baris-siswa hover:bg-pink-50/20 transition-colors group";
                        tr.dataset.nama = siswa.nama.toLowerCase();
                        tr.innerHTML = `
                            <td class="p-4 md:p-5 flex items-center gap-3">
                                ${siswa.foto_url ? `<img src="${safeImageURL(siswa.foto_url)}" alt="Foto ${escapeHTML(siswa.nama)}" class="w-10 h-10 rounded-full object-cover border border-pink-200">` : `<div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center font-bold text-purple-700 text-xs border border-pink-200">${escapeHTML(inisial)}</div>`}
                                <div>
                                    <p class="font-bold text-purple-950">${escapeHTML(siswa.nama)}</p>
                                </div>
                            </td>
                                <td data-label="Alamat" class="p-4 md:p-5 text-slate-600 text-xs">${escapeHTML(siswa.alamat)}</td>
                                <td data-label="TTL" class="p-4 md:p-5 text-slate-600 text-xs">${escapeHTML(siswa.tempat_lahir)}, ${escapeHTML(siswa.tanggal_lahir)}</td>
                                <td data-label="Sabuk" class="p-4 md:p-5 text-center">
                                <span class="${badgeColor} px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider">${escapeHTML(siswa.sabuk)}</span>
                            </td>
                                <td data-label="Aksi" class="p-4 md:p-5 text-center">
                                <button onclick="toggleRow('${rowId}', '${iconId}')" class="bg-purple-100 text-purple-900 hover:bg-purple-200 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 mx-auto">
                                    <span>Rekap Ujian</span>
                                    <svg id="${iconId}" class="w-4 h-4 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);

                        // Template baris dropdown detail rekap bulanan
                        let trDetail = document.createElement('tr');
                        trDetail.id = rowId;
                        trDetail.dataset.siswaId = siswa.id;
                        trDetail.className = "detail-row hidden bg-purple-50/30 border-b border-pink-100";
                        trDetail.innerHTML = `
                            <td colspan="5" class="p-6 md:px-8">
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                          <h5 class="font-bold text-purple-950 text-xs uppercase tracking-wider">Riwayat Ujian Bulanan - ${escapeHTML(siswa.nama)}</h5>
                                         <span class="text-[10px] text-pink-600 font-bold bg-pink-100/70 px-2.5 py-0.5 rounded-md">Setiap bulan</span>
                                    </div>
                                    <div class="rekap-panel bg-white rounded-2xl border border-pink-200 overflow-hidden shadow-2xs p-4">
                                         <p class="text-xs text-slate-400">Buka untuk memuat rekap siswa.</p>
                                    </div>
                                </div>
                            </td>
                        `;
                        tr.dataset.detailId = rowId;
                        tbody.appendChild(trDetail);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400">Belum ada siswa yang terdaftar.</td></tr>`;
                }
            } catch (error) {
                console.error("Gagal mengambil data siswa:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-500">Data siswa belum bisa dimuat.</td></tr>`;
            }
        });

        document.getElementById('cari-siswa').addEventListener('input', (event) => {
            const kataKunci = event.target.value.trim().toLowerCase();
            document.querySelectorAll('.baris-siswa').forEach((row) => {
                const cocok = row.dataset.nama.includes(kataKunci);
                row.classList.toggle('hidden', !cocok);
                const detail = document.getElementById(row.dataset.detailId);
                if (detail && !cocok) detail.classList.add('hidden');
            });
        });

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const button = document.querySelector('button[aria-label="Buka menu"]');
            const isHidden = menu.classList.toggle('hidden');
            button.setAttribute('aria-expanded', String(!isHidden));
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>'"]/g, (character) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[character]));
        }

        function safeImageURL(value) {
            const url = String(value || '');
            return /^https?:\/\//i.test(url) ? escapeHTML(url) : '';
        }
    </script>
</body>
</html>
