<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PSHT Ranting Genuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FDF8FA] text-slate-800 font-sans">
    <main class="min-h-screen flex items-center justify-center p-4 sm:p-6">
        <section id="login-panel" class="w-full max-w-md bg-white rounded-3xl border border-pink-200 shadow-xl p-6 sm:p-8">
            <div class="mb-8">
                <p class="text-pink-500 font-mono text-xs uppercase tracking-widest font-bold">Halaman Pengurus</p>
                <h1 class="text-3xl font-black uppercase text-purple-950 mt-2">Masuk Admin</h1>
                <p class="text-sm text-slate-500 mt-2">Kelola data siswa, pelatih, dan kegiatan latihan.</p>
            </div>
            <form id="login-form" class="space-y-4">
                <label class="block text-sm font-bold text-purple-950">Username
                    <input name="username" required autocomplete="username" class="mt-2 w-full rounded-xl border border-pink-200 px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500">
                </label>
                <label class="block text-sm font-bold text-purple-950">Password
                    <input name="password" type="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border border-pink-200 px-4 py-3 outline-none focus:ring-2 focus:ring-purple-500">
                </label>
                <p id="login-error" class="hidden text-sm text-rose-600"></p>
                <button class="w-full rounded-xl bg-purple-800 px-4 py-3 text-sm font-bold uppercase tracking-wider text-white hover:bg-purple-900">Masuk</button>
            </form>
            <a href="/" class="block mt-6 text-center text-xs font-bold text-purple-700 hover:text-pink-600">Kembali ke halaman utama</a>
        </section>

        <section id="dashboard-panel" class="hidden w-full max-w-5xl self-start py-6 sm:py-10">
            <header class="flex flex-col sm:flex-row justify-between gap-4 mb-8">
                <div>
                    <p class="text-pink-500 font-mono text-xs uppercase tracking-widest font-bold">Halaman Pengurus</p>
                    <h1 class="text-3xl font-black uppercase text-purple-950 mt-2">Kelola Data Ranting</h1>
                </div>
                <button id="logout-button" class="self-start rounded-xl border border-pink-200 bg-white px-4 py-2 text-xs font-bold uppercase text-purple-800">Keluar</button>
            </header>
            <div class="grid gap-6 lg:grid-cols-3">
                <form data-endpoint="siswa" data-category="siswa" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Tambah Siswa</h2>
                    <input name="nama" required placeholder="Nama lengkap" class="field">
                    <input name="alamat" required placeholder="Alamat / domisili" class="field">
                    <input name="tempat_lahir" required placeholder="Tempat lahir" class="field">
                    <input name="tanggal_lahir" type="date" required class="field">
                    <select name="sabuk" required class="field"><option value="">Pilih sabuk</option><option value="Polos">Polos</option><option value="Jambon">Jambon</option><option value="Telor">Telor</option><option value="Hijau">Hijau</option><option value="Putih">Putih</option></select>
                    <input name="foto" type="file" accept="image/jpeg,image/png,image/webp" class="field">
                    <button class="submit-button">Simpan Siswa</button>
                </form>
                <form data-endpoint="pengurus" data-category="pengurus" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Tambah Pengurus</h2>
                    <input name="jabatan" required placeholder="Jabatan" class="field">
                    <input name="nama" required placeholder="Nama" class="field">
                    <textarea name="keterangan" placeholder="Keterangan" class="field min-h-24"></textarea>
                    <input name="foto" type="file" accept="image/jpeg,image/png,image/webp" class="field">
                    <button class="submit-button">Simpan Pengurus</button>
                </form>
                <form data-endpoint="pelatih" data-category="pelatih" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Tambah Pelatih</h2>
                    <input name="nama" required placeholder="Nama" class="field">
                    <input name="tingkatan" required placeholder="Tingkatan" class="field">
                    <input name="spesialisasi" required placeholder="Spesialisasi / fokus" class="field">
                    <input name="kontak" required placeholder="Kontak / WhatsApp" class="field">
                    <input name="status" value="Aktif" placeholder="Status" class="field">
                    <input name="foto" type="file" accept="image/jpeg,image/png,image/webp" class="field">
                    <button class="submit-button">Simpan Pelatih</button>
                </form>
                <form data-endpoint="absensi" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Input Absensi</h2>
                    <select id="siswa-absensi" name="siswa_id" required class="field"><option value="">Pilih siswa</option></select>
                    <input name="tanggal" type="date" required class="field">
                    <select name="status" required class="field"><option value="hadir">Hadir</option><option value="izin">Izin</option><option value="alpha">Alpha</option></select>
                    <button class="submit-button">Simpan Absensi</button>
                </form>
                <form data-endpoint="penilaian" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Input Penilaian</h2>
                    <select id="siswa-penilaian" name="siswa_id" required class="field"><option value="">Pilih siswa</option></select>
                    <input name="periode_bulan" required placeholder="Periode, contoh: Juni 2026" class="field">
                    <input name="materi" required placeholder="Materi penilaian" class="field">
                    <input name="nilai_angka" type="number" min="0" max="100" required placeholder="Nilai angka (0-100)" class="field">
                    <input name="predikat" required placeholder="Predikat, contoh: Baik" class="field">
                    <button class="submit-button">Simpan Penilaian</button>
                </form>
                <form data-endpoint="ujian" class="admin-form bg-white rounded-3xl border border-pink-200 p-5 sm:p-6 shadow-sm space-y-3">
                    <h2 class="text-xl font-black uppercase text-purple-950 mb-4">Input Ujian</h2>
                    <select id="siswa-ujian" name="siswa_id" required class="field"><option value="">Pilih siswa</option></select>
                    <input name="periode" type="date" required class="field">
                    <input name="nilai" type="number" min="0" max="100" step="0.01" required placeholder="Nilai (0-100)" class="field">
                    <select name="status" required class="field"><option value="Lulus">Lulus</option><option value="Belum Lulus">Belum Lulus</option></select>
                    <textarea name="catatan" placeholder="Catatan ujian" class="field min-h-24"></textarea>
                    <button class="submit-button">Simpan Ujian</button>
                </form>
            </div>
            <p id="form-message" class="mt-6 text-sm font-bold"></p>
        </section>
    </main>
    <style>
        .field { width: 100%; border: 1px solid #fbcfe8; border-radius: .75rem; padding: .7rem 1rem; outline: none; }
        .field:focus { box-shadow: 0 0 0 2px #7e22ce; }
        .submit-button { width: 100%; border-radius: .75rem; background: #6b21a8; color: white; padding: .75rem 1rem; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    </style>
    <script>
        const loginPanel = document.getElementById('login-panel');
        const dashboardPanel = document.getElementById('dashboard-panel');
        const formMessage = document.getElementById('form-message');

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const body = Object.fromEntries(new FormData(event.target));
            const response = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            if (!response.ok) {
                const error = document.getElementById('login-error');
                error.textContent = 'Username atau password salah.';
                error.classList.remove('hidden');
                return;
            }
            loginPanel.classList.add('hidden');
            dashboardPanel.classList.remove('hidden');
            loadStudentsIntoForms();
        });

        document.querySelectorAll('.admin-form').forEach((form) => form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const body = Object.fromEntries(new FormData(form));
            const foto = form.querySelector('input[type="file"]')?.files[0];
            if (foto) {
                const uploadData = new FormData();
                uploadData.append('file', foto);
                uploadData.append('category', form.dataset.category);
                const uploadResponse = await fetch('/api/admin/upload', { method: 'POST', body: uploadData });
                if (!uploadResponse.ok) {
                    formMessage.textContent = 'Foto gagal diunggah.';
                    formMessage.className = 'mt-6 text-sm font-bold text-rose-600';
                    return;
                }
                const uploadResult = await uploadResponse.json();
                body.foto_url = uploadResult.foto_url;
            }
            delete body.foto;
            const response = await fetch('/api/admin/' + form.dataset.endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            formMessage.textContent = response.ok ? 'Data berhasil disimpan.' : 'Data gagal disimpan.';
            formMessage.className = response.ok ? 'mt-6 text-sm font-bold text-green-700' : 'mt-6 text-sm font-bold text-rose-600';
            if (response.ok) form.reset();
        }));

        document.getElementById('logout-button').addEventListener('click', async () => {
            await fetch('/api/admin/logout', {method: 'POST'});
            window.location.reload();
        });

        fetch('/api/admin/session').then((response) => {
            if (response.ok) {
                loginPanel.classList.add('hidden');
                dashboardPanel.classList.remove('hidden');
                loadStudentsIntoForms();
            }
        });

        async function loadStudentsIntoForms() {
            const response = await fetch('/api/siswa');
            if (!response.ok) return;
            const students = await response.json();
            ['siswa-absensi', 'siswa-penilaian', 'siswa-ujian'].forEach((id) => {
                const select = document.getElementById(id);
                students.forEach((student) => {
                    const option = document.createElement('option');
                    option.value = student.id;
                    option.textContent = student.nama + ' - ' + student.sabuk;
                    select.appendChild(option);
                });
            });
        }

        const today = new Date().toISOString().slice(0, 10);
        document.querySelector('[data-endpoint="absensi"] input[name="tanggal"]').value = today;
        document.querySelector('[data-endpoint="ujian"] input[name="periode"]').value = today;

    </script>
</body>
</html>
